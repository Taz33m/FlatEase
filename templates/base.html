<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FlatFinder{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <script src="https://kit.fontawesome.com/your-fontawesome-kit.js" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <header class="bg-yellow-400 py-4 px-6 md:px-10 sticky top-0 z-10 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <a href="{{ url_for('main.index') }}" class="text-2xl font-bold text-gray-900">FlatFinder</a>
            <nav class="hidden md:flex space-x-6">
                <a href="{{ url_for('main.index') }}" class="text-gray-900 hover:text-gray-700 transition-colors">Home</a>
                <a href="{{ url_for('main.property_list') }}" class="text-gray-900 hover:text-gray-700 transition-colors">Listings</a>
                <a href="#" class="text-gray-900 hover:text-gray-700 transition-colors">About</a>
                <a href="#" class="text-gray-900 hover:text-gray-700 transition-colors">Contact</a>
            </nav>
            <button id="mobile-menu-button" class="md:hidden text-gray-900">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>
    </header>

    <div id="mobile-menu" class="hidden bg-yellow-400 text-gray-900 py-4 px-6 md:hidden">
        <nav class="flex flex-col space-y-4">
            <a href="{{ url_for('main.index') }}" class="hover:text-gray-700 transition-colors">Home</a>
            <a href="{{ url_for('main.property_list') }}" class="hover:text-gray-700 transition-colors">Listings</a>
            <a href="#" class="hover:text-gray-700 transition-colors">About</a>
            <a href="#" class="hover:text-gray-700 transition-colors">Contact</a>
        </nav>
    </div>

    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-900 text-white py-6 px-6 md:px-10 mt-12">
        <div class="container mx-auto text-center">
            <p>&copy; 2023 FlatFinder. All rights reserved.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
